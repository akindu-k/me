<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657 435" width="657" height="435">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1f1a"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
  </defs>
  <rect width="657" height="435" fill="url(#bg)"/>
  <!-- live badge -->
  <g transform="translate(70 60)" font-family="-apple-system, Helvetica, Arial">
    <rect width="78" height="28" rx="14" fill="#30d158" fill-opacity="0.15"/>
    <circle cx="18" cy="14" r="5" fill="#30d158"/>
    <text x="30" y="19" fill="#30d158" font-size="13" font-weight="600" letter-spacing="1">LIVE</text>
  </g>
  <!-- donut: 52 / 31 / 17 -->
  <g transform="translate(190 222)" fill="none" stroke-width="34">
    <circle r="88" stroke="#2c2c2e"/>
    <circle r="88" stroke="#30d158" stroke-dasharray="287.5 552.9" transform="rotate(-90)"/>
    <circle r="88" stroke="#64d2ff" stroke-dasharray="171.4 552.9" stroke-dashoffset="-287.5" transform="rotate(-90)"/>
    <circle r="88" stroke="#5e5ce6" stroke-dasharray="94 552.9" stroke-dashoffset="-458.9" transform="rotate(-90)"/>
  </g>
  <text x="190" y="232" text-anchor="middle" fill="#f5f5f7" font-size="30" font-weight="700" font-family="-apple-system, Helvetica, Arial">52%</text>
  <!-- leaderboard -->
  <g font-family="-apple-system, Helvetica, Arial" font-size="15">
    <text x="350" y="150" fill="#f5f5f7">Candidate A</text>
    <rect x="350" y="162" width="240" height="12" rx="6" fill="#2c2c2e"/>
    <rect x="350" y="162" width="200" height="12" rx="6" fill="#30d158"/>
    <text x="350" y="214" fill="#f5f5f7">Candidate B</text>
    <rect x="350" y="226" width="240" height="12" rx="6" fill="#2c2c2e"/>
    <rect x="350" y="226" width="119" height="12" rx="6" fill="#64d2ff"/>
    <text x="350" y="278" fill="#f5f5f7">Candidate C</text>
    <rect x="350" y="290" width="240" height="12" rx="6" fill="#2c2c2e"/>
    <rect x="350" y="290" width="65" height="12" rx="6" fill="#5e5ce6"/>
  </g>
  <text x="328" y="392" text-anchor="middle" fill="#86868b" font-size="15" font-family="-apple-system, Helvetica, Arial" letter-spacing="2">REFRESHES EVERY 30 SECONDS</text>
</svg>
